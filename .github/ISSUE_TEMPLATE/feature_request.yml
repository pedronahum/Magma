name: Feature request
description: Suggest an API, layer, backend or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, and why the current API does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: For API proposals, a short Swift sketch helps (PyTorch equivalents welcome).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
