name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Build and test on Linux (primary platform)
  linux:
    runs-on: ubuntu-latest
    container: swift:5.9-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -v

      - name: Run StableHLO Tests (No XLA Required)
        run: swift test --filter StableHLOTests -v

  # Build on macOS
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Build
        run: swift build -v

      - name: Run StableHLO Tests (No XLA Required)
        run: swift test --filter StableHLOTests -v

  # Code formatting check
  lint:
    runs-on: ubuntu-latest
    container: swift:5.9-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Check Swift syntax
        run: |
          find Sources Tests -name "*.swift" -exec swift -parse {} \;
