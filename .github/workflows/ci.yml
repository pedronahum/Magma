name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build every target (library, examples, tests) and run the tests that need
  # no PJRT plugin. Suites that execute on a real backend are skipped
  # automatically when no plugin is installed.
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported toolchain and the toolchain the project is tested on.
        swift: ['6.0', '6.3']
    container: swift:${{ matrix.swift }}-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Build (all targets, including tests)
        run: swift build --build-tests

      - name: Test (no PJRT plugin required)
        run: swift test --skip-build --filter 'StableHLOTests|LazyTensorTests|XLARuntimeTests'

  # macOS needs a swift.org toolchain: Xcode's toolchain does not ship the
  # _Differentiation module. The Metal backend is opt-in (MAGMA_ENABLE_METAL=1)
  # and is not built here.
  macos:
    name: macOS (Swift 6.3)
    runs-on: macos-15
    continue-on-error: true  # experimental until the macOS path is routinely verified
    steps:
      - uses: actions/checkout@v4

      - name: Install swift.org toolchain
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . ~/.swiftly/env.sh
          swiftly install --use --assume-yes 6.3
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Build (all targets, including tests)
        run: |
          swift --version
          swift build --build-tests

      - name: Test (no PJRT plugin required)
        run: swift test --skip-build --filter 'StableHLOTests|LazyTensorTests|XLARuntimeTests'
